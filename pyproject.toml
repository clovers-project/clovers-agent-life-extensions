[project]
name = "clovers-agent-life-extensions"
dynamic = ["version"]
description = ""
authors = [{ name = "KarisAya", email = "karisaya@foxmail.com" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<4.0.0"
dependencies = [
    "clovers-agent>=0.3.3",
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
    "python-frontmatter>=1.3.0",
    "rapidfuzz>=3.14.6",
    "torch>=2.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "clovers_agent_life_extensions/__init__.py"

[tool.uv.sources]
clovers-agent = { path = "D:/CLOVERS/clovers-agent/clovers-agent", editable = true }
